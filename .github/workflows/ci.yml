name: CI

# Mirrors the local quality gate from AGENTS.md (§1, §4): check · build · test.
# Runs on every push and pull request so a red run blocks merge to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · build · test
    runs-on: ubuntu-latest
    # check/build/test need only read; the comment step below needs to write a
    # comment on the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & template check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Build test report
        # Run even when a test step failed so failures are reported too.
        if: ${{ !cancelled() }}
        run: node scripts/test-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Comment test results on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "reports/comment.md";
            if (!fs.existsSync(path)) return;
            const marker = "<!-- ci-test-results -->";
            const body = fs.readFileSync(path, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find(
                (c) => c.user?.type === "Bot" && c.body?.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              // On fork PRs the token is read-only; don't fail CI over a comment.
              core.warning(`Could not post the test-results comment: ${error.message}`);
            }
