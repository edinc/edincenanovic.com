name: CI

# Mirrors the local quality gate from AGENTS.md (§1, §4): check · build · test.
# Runs on every push and pull request so a red run blocks merge to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · build · test
    runs-on: ubuntu-latest
    # check/build/test need only read; the results-publishing step below needs
    # to write a check run and a comment on the PR.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & template check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Publish test results to the PR
        # Run even when a test step failed so failures are reported too.
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2
        with:
          check_name: Test results
          comment_mode: always
          files: |
            test-results/vitest-junit.xml
            test-results/playwright-junit.xml
